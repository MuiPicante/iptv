name: Update IPTV Playlist

# Wann soll das Skript laufen?
on:
  schedule:
    - cron: '0 */3 * * *' # Läuft alle 3 Stunden
  workflow_dispatch:      # Erlaubt dir, es per Button manuell zu starten

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python Skript ausführen
        run: python update.py

      - name: Änderungen auf GitHub speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.m3u
          # Erstellt nur einen Commit, wenn sich die Datei wirklich geändert hat
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-Update DMAX Link"
          git push
